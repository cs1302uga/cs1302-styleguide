name: Style Guide CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: [ "21", "25" ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install coverage shellcheck-py

      - name: Run ShellCheck
        run: |
          shellcheck install.sh upgrade.sh etc/check_template.sh etc/checkstyle_template.sh etc/git-hooks/pre-commit

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ matrix.java-version }}

      - name: Install Style Guide and Checkstyle
        run: |
          ./install.sh --prefix="$HOME/.local/check1302"
          echo "$HOME/.local/check1302/bin" >> "$GITHUB_PATH"

      - name: Run Test Suite with Coverage Check
        run: |
          coverage run --source=etc -m unittest discover -s tests -v
          coverage report -m --fail-under=100

      - name: Verify README.md is up to date
        run: |
          python etc/build_readme.py --check

      - name: Verify 100% Style Guide Synchronization
        run: |
          python etc/check_sync.py
