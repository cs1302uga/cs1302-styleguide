name: Style Guide CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install coverage shellcheck-py

      - name: Run ShellCheck
        run: |
          shellcheck install.sh upgrade.sh etc/check_template.sh etc/checkstyle_template.sh etc/git-hooks/pre-commit

      - name: Run Test Suite with Coverage Check
        run: |
          coverage run --source=etc -m unittest discover -s tests -v
          coverage report -m --fail-under=100

      - name: Verify README.md is up to date
        run: |
          python etc/build_readme.py --check

      - name: Verify 100% Style Guide Synchronization
        run: |
          python etc/check_sync.py
